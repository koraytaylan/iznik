# Publish the latest verified develop artifacts as one rolling prerelease.
#
# The release keeps a stable download URL while its tag and assets move with
# each successful develop build. Stable versioned releases remain separate.
name: snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

# A newer push waits for the running publish rather than cancelling it: a
# cancelled publish can stop between two uploads and leave the release with
# assets from two different commits. Only the newest waiting run is kept.
concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gates, exactly as a pull request runs them. Nothing below starts until
  # they pass, so what is published is a build the gates have verified.
  check:
    name: Gates
    uses: ./.github/workflows/check.yml

  # Every application bundle carries every server, because the machine a
  # person connects to is rarely the kind they connect from: a Mac reaching
  # Linux servers is the common case. The servers are built once, here, and
  # downloaded by each bundling job.
  #
  # There is no Windows server. Its daemon listens on loopback TCP with no
  # authentication, so any local user of the host could open a shell, and
  # the client cannot start it there anyway: the relay command it sends is
  # quoted for a POSIX shell. `xtask distribution` refuses the Windows
  # triples for the same reasons.
  servers-linux:
    name: Linux servers
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Install the pinned Zig toolchain
        shell: bash
        run: bash scripts/ci/install-zig.sh

      # .cargo/config.toml names `<arch>-linux-musl-gcc` as the linkers. Zig
      # ships a complete musl toolchain, so these route to it: cc-rs passes a
      # clang-style --target that zig rejects, and zig cc enables UBSan by
      # default, whose handlers are not on the link line rustc drives.
      - name: Provide the cross linkers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iznik-tools"
          for machine in x86_64 aarch64; do
            cat > "$RUNNER_TEMP/iznik-tools/${machine}-linux-musl-gcc" <<SCRIPT
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            [[ "\$argument" == --target=* ]] || arguments+=("\$argument")
          done
          exec zig cc -target ${machine}-linux-musl -fno-sanitize=undefined "\${arguments[@]}"
          SCRIPT
            chmod +x "$RUNNER_TEMP/iznik-tools/${machine}-linux-musl-gcc"
          done
          echo "$RUNNER_TEMP/iznik-tools" >> "$GITHUB_PATH"

      - name: Build the Linux servers
        run: |
          cargo xtask distribution --target x86_64-unknown-linux-musl
          cargo xtask distribution --target aarch64-unknown-linux-musl

      - name: Upload the Linux servers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: servers-linux
          if-no-files-found: error
          path: target/distribution

  servers-darwin:
    name: macOS servers
    needs: [check]
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install the pinned Zig toolchain
        shell: bash
        run: bash scripts/ci/install-zig.sh

      - name: Point at the SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build the macOS servers
        run: |
          cargo xtask distribution --target aarch64-apple-darwin
          cargo xtask distribution --target x86_64-apple-darwin

      - name: Upload the macOS servers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: servers-darwin
          if-no-files-found: error
          path: target/distribution

  linux:
    name: Linux application bundle
    needs: [servers-linux, servers-darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Install the pinned Zig toolchain
        shell: bash
        run: bash scripts/ci/install-zig.sh

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Download every server
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: servers-*
          merge-multiple: true
          path: ${{ runner.temp }}/servers

      - name: Build the Linux application
        run: cargo build --locked --release --package iznik-app

      - name: Bundle the Linux application
        run: |
          cargo xtask app-bundle --target x86_64-unknown-linux-gnu \
            --binary target/release/iznik-app --output "$RUNNER_TEMP/iznik-linux" \
            --servers "$RUNNER_TEMP/servers"
          tar -czf "$RUNNER_TEMP/iznik-linux.tar.gz" -C "$RUNNER_TEMP/iznik-linux" .

      - name: Upload the Linux application
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: application-linux
          if-no-files-found: error
          path: ${{ runner.temp }}/iznik-linux.tar.gz

  # Signed with a Developer ID and notarized when the secrets for both are
  # there — README.md "Distribution" names them — and ad hoc otherwise, which
  # the release notes then say. `xtask app-bundle` signs; this job only puts
  # the certificate where `codesign` finds it, and names it in
  # IZNIK_CODESIGN_IDENTITY.
  darwin:
    name: macOS application bundles
    needs: [servers-linux, servers-darwin]
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      signature: ${{ steps.notarization.outputs.signature }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install the pinned Zig toolchain
        shell: bash
        run: bash scripts/ci/install-zig.sh

      - name: Point at the SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Download every server
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: servers-*
          merge-multiple: true
          path: ${{ runner.temp }}/servers

      # Into a keychain of this run's own, removed at the end of the job, so
      # the certificate never reaches the runner's login keychain.
      - name: Import the Developer ID certificate
        id: signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE" || -z "$CERTIFICATE_PASSWORD" || -z "$IDENTITY" ]]; then
            echo "No Developer ID certificate among the secrets: the bundles are signed ad hoc."
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/iznik-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -f pkcs12 -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r listed; do
            existing+=("$(echo "$listed" | tr -d ' "')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          echo "IZNIK_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"

      # Each bundle is `iznik.app` inside its archive, the name Finder and
      # `stapler` expect of an application.
      - name: Build the Darwin applications
        run: |
          set -euo pipefail
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --package iznik-app --target "$triple"
            mkdir -p "$RUNNER_TEMP/iznik-$triple"
            cargo xtask app-bundle --target "$triple" \
              --binary "target/$triple/release/iznik-app" \
              --output "$RUNNER_TEMP/iznik-$triple/iznik.app" \
              --servers "$RUNNER_TEMP/servers"
          done

      # Only a Developer ID signature can be notarized. The ticket is stapled
      # to the bundle, so Gatekeeper accepts it without asking Apple.
      - name: Notarize the macOS applications
        id: notarization
        env:
          SIGNING: ${{ steps.signing.outputs.mode }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING" != developer-id ]]; then
            echo "signature=ad-hoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" ]]; then
            echo "No notarization credentials among the secrets: the bundles are signed but not notarized."
            echo "signature=developer-id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            bundle="$RUNNER_TEMP/iznik-$triple/iznik.app"
            ditto -c -k --keepParent "$bundle" "$RUNNER_TEMP/notarize-$triple.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize-$triple.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
            xcrun stapler staple "$bundle"
            xcrun stapler validate "$bundle"
            rm -f "$RUNNER_TEMP/notarize-$triple.zip"
          done
          echo "signature=notarized" >> "$GITHUB_OUTPUT"

      - name: Archive the macOS applications
        run: |
          set -euo pipefail
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -czf "$RUNNER_TEMP/iznik-$triple.tar.gz" -C "$RUNNER_TEMP/iznik-$triple" iznik.app
          done

      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/iznik-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi

      - name: Upload the macOS applications
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: application-darwin
          if-no-files-found: error
          path: ${{ runner.temp }}/iznik-*.tar.gz

  windows:
    name: Windows application bundle
    needs: [servers-linux, servers-darwin]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install

      # libghostty-vt is built by Zig, including the Windows MSVC target.
      - name: Install the pinned Zig toolchain
        shell: bash
        run: bash scripts/ci/install-zig.sh

      - name: Download every server
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: servers-*
          merge-multiple: true
          path: ${{ runner.temp }}/servers

      - name: Build the Windows application
        shell: pwsh
        run: cargo build --locked --release --package iznik-app

      - name: Bundle the Windows application
        shell: pwsh
        run: |
          cargo xtask app-bundle --target x86_64-pc-windows-msvc `
            --binary target/release/iznik-app.exe `
            --output "$env:RUNNER_TEMP/iznik-windows" `
            --servers "$env:RUNNER_TEMP/servers"
          tar -a -cf "$env:RUNNER_TEMP/iznik-x86_64-pc-windows-msvc.zip" -C "$env:RUNNER_TEMP/iznik-windows" .

      - name: Upload the Windows application
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: application-windows
          if-no-files-found: error
          path: ${{ runner.temp }}/iznik-x86_64-pc-windows-msvc.zip

  publish:
    name: Replace the rolling prerelease
    needs: [linux, darwin, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the verified application bundles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: application-*
          path: ${{ runner.temp }}/applications

      - name: Stage the application bundles and their checksums
        env:
          APPLICATIONS: ${{ runner.temp }}/applications
          STAGING: ${{ runner.temp }}/snapshot
        run: |
          set -euo pipefail
          mkdir -p "$STAGING"
          find "$APPLICATIONS" -type f \( -name 'iznik-*.tar.gz' -o -name 'iznik-*.zip' \) -exec cp '{}' "$STAGING/" ';'
          test "$(find "$STAGING" -maxdepth 1 -type f -name 'iznik-*.tar.gz' | wc -l)" -eq 3
          test "$(find "$STAGING" -maxdepth 1 -type f -name 'iznik-*.zip' | wc -l)" -eq 1
          # The shape `sha256sum --check` reads, one line per archive.
          (cd "$STAGING" && sha256sum iznik-* > SHA256SUMS)
          cat "$STAGING/SHA256SUMS"

      # Every asset is replaced in place with --clobber, so a download during
      # a publish finds either the previous archive or the new one, never a
      # missing one. SHA256SUMS goes last, after the archives it describes;
      # only then does the tag move to this commit, and only then is an asset
      # this build no longer produces removed.
      - name: Replace the trusted rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: develop-snapshot
          SNAPSHOT_TITLE: Iznik develop snapshot
          STAGING: ${{ runner.temp }}/snapshot
          DARWIN_SIGNATURE: ${{ needs.darwin.outputs.signature }}
        run: |
          set -euo pipefail
          case "$DARWIN_SIGNATURE" in
            notarized) darwin="The macOS applications are signed with a Developer ID and notarized.";;
            developer-id) darwin="The macOS applications are signed with a Developer ID but not notarized: Gatekeeper asks before the first launch, and right-click > Open allows it.";;
            *) darwin="The macOS applications are signed ad hoc, not with a Developer ID, and not notarized: Gatekeeper refuses the first launch until it is allowed with right-click > Open, or with xattr -dr com.apple.quarantine iznik.app.";;
          esac
          notes="Rolling GPUI application candidate from develop commit $GITHUB_SHA, published after the gates in check.yml passed. Linux, macOS and Windows client archives are replaced after each successful build; this is not a stable release. SHA256SUMS lists the digest of every archive. Each archive carries the Linux and macOS servers the application installs on a remote host; no Windows server is published. $darwin The Windows client is an unsigned zip, and it opens one ssh per command because Win32-OpenSSH cannot multiplex."
          if ! gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --title "$SNAPSHOT_TITLE" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" "$STAGING"/iznik-* --clobber
          gh release upload "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" "$STAGING/SHA256SUMS" --clobber
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" -f sha="$GITHUB_SHA" -F force=true
          gh release edit "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --title "$SNAPSHOT_TITLE" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          while IFS= read -r asset; do
            if [[ ! -e "$STAGING/$asset" ]]; then
              gh release delete-asset "$SNAPSHOT_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done < <(gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
