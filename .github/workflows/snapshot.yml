# Publish the latest verified develop artifacts as one rolling prerelease.
#
# The release keeps a stable download URL while its tag and assets move with
# each successful develop build. Stable versioned releases remain separate.
name: snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every application bundle carries every server, because the machine a
  # person connects to is rarely the kind they connect from: a Mac reaching
  # Linux servers is the common case. The servers are built once, here, and
  # downloaded by each bundling job.
  servers-linux:
    name: Linux servers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install the pinned Zig toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      # .cargo/config.toml names `<arch>-linux-musl-gcc` as the linkers. Zig
      # ships a complete musl toolchain, so these route to it: cc-rs passes a
      # clang-style --target that zig rejects, and zig cc enables UBSan by
      # default, whose handlers are not on the link line rustc drives.
      - name: Provide the cross linkers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iznik-tools"
          for machine in x86_64 aarch64; do
            cat > "$RUNNER_TEMP/iznik-tools/${machine}-linux-musl-gcc" <<SCRIPT
          #!/usr/bin/env bash
          arguments=()
          for argument in "\$@"; do
            [[ "\$argument" == --target=* ]] || arguments+=("\$argument")
          done
          exec zig cc -target ${machine}-linux-musl -fno-sanitize=undefined "\${arguments[@]}"
          SCRIPT
            chmod +x "$RUNNER_TEMP/iznik-tools/${machine}-linux-musl-gcc"
          done
          echo "$RUNNER_TEMP/iznik-tools" >> "$GITHUB_PATH"

      - name: Build the Linux servers
        run: |
          cargo xtask distribution --target x86_64-unknown-linux-musl
          cargo xtask distribution --target aarch64-unknown-linux-musl

      - name: Upload the Linux servers
        uses: actions/upload-artifact@v4
        with:
          name: servers-linux
          if-no-files-found: error
          path: target/distribution

  servers-darwin:
    name: macOS servers
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install the pinned Zig toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Point at the SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build the macOS servers
        run: |
          cargo xtask distribution --target aarch64-apple-darwin
          cargo xtask distribution --target x86_64-apple-darwin

      - name: Upload the macOS servers
        uses: actions/upload-artifact@v4
        with:
          name: servers-darwin
          if-no-files-found: error
          path: target/distribution

  servers-windows:
    name: Windows server
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the pinned Zig toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build the Windows server
        shell: pwsh
        run: cargo xtask distribution --target x86_64-pc-windows-msvc

      - name: Upload the Windows server
        uses: actions/upload-artifact@v4
        with:
          name: servers-windows
          if-no-files-found: error
          path: target/distribution

  linux:
    name: Linux application bundle
    needs: [servers-linux, servers-darwin, servers-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the pinned Zig toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Download every server
        uses: actions/download-artifact@v4
        with:
          pattern: servers-*
          merge-multiple: true
          path: ${{ runner.temp }}/servers

      - name: Build the Linux application
        run: cargo build --locked --release --package iznik-app

      - name: Bundle the Linux application
        run: |
          cargo xtask app-bundle --target x86_64-unknown-linux-gnu \
            --binary target/release/iznik-app --output "$RUNNER_TEMP/iznik-linux" \
            --servers "$RUNNER_TEMP/servers"
          tar -czf "$RUNNER_TEMP/iznik-linux.tar.gz" -C "$RUNNER_TEMP/iznik-linux" .

      - name: Upload the Linux application
        uses: actions/upload-artifact@v4
        with:
          name: application-linux
          if-no-files-found: error
          path: ${{ runner.temp }}/iznik-linux.tar.gz

  darwin:
    name: macOS application bundles
    needs: [servers-linux, servers-darwin, servers-windows]
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install the pinned Zig toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Point at the SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Download every server
        uses: actions/download-artifact@v4
        with:
          pattern: servers-*
          merge-multiple: true
          path: ${{ runner.temp }}/servers

      - name: Build the Darwin applications
        run: |
          cargo build --locked --release --package iznik-app --target aarch64-apple-darwin
          cargo build --locked --release --package iznik-app --target x86_64-apple-darwin
          cargo xtask app-bundle --target aarch64-apple-darwin \
            --binary target/aarch64-apple-darwin/release/iznik-app \
            --output "$RUNNER_TEMP/iznik-aarch64-apple-darwin" \
            --servers "$RUNNER_TEMP/servers"
          cargo xtask app-bundle --target x86_64-apple-darwin \
            --binary target/x86_64-apple-darwin/release/iznik-app \
            --output "$RUNNER_TEMP/iznik-x86_64-apple-darwin" \
            --servers "$RUNNER_TEMP/servers"
          tar -czf "$RUNNER_TEMP/iznik-aarch64-apple-darwin.tar.gz" \
            -C "$RUNNER_TEMP/iznik-aarch64-apple-darwin" .
          tar -czf "$RUNNER_TEMP/iznik-x86_64-apple-darwin.tar.gz" \
            -C "$RUNNER_TEMP/iznik-x86_64-apple-darwin" .

      - name: Upload the macOS applications
        uses: actions/upload-artifact@v4
        with:
          name: application-darwin
          if-no-files-found: error
          path: ${{ runner.temp }}/iznik-*.tar.gz

  windows:
    name: Windows application bundle
    needs: [servers-linux, servers-darwin, servers-windows]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # libghostty-vt is built by Zig, including the Windows MSVC target.
      - name: Install the pinned Zig toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Download every server
        uses: actions/download-artifact@v4
        with:
          pattern: servers-*
          merge-multiple: true
          path: ${{ runner.temp }}/servers

      - name: Build the Windows application
        shell: pwsh
        run: cargo build --locked --release --package iznik-app

      - name: Bundle the Windows application
        shell: pwsh
        run: |
          cargo xtask app-bundle --target x86_64-pc-windows-msvc `
            --binary target/release/iznik-app.exe `
            --output "$env:RUNNER_TEMP/iznik-windows" `
            --servers "$env:RUNNER_TEMP/servers"
          tar -a -cf "$env:RUNNER_TEMP/iznik-x86_64-pc-windows-msvc.zip" -C "$env:RUNNER_TEMP/iznik-windows" .

      - name: Upload the Windows application
        uses: actions/upload-artifact@v4
        with:
          name: application-windows
          if-no-files-found: error
          path: ${{ runner.temp }}/iznik-x86_64-pc-windows-msvc.zip

  publish:
    name: Replace the rolling prerelease
    needs: [linux, darwin, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the verified application bundles
        uses: actions/download-artifact@v4
        with:
          pattern: application-*
          path: ${{ runner.temp }}/applications

      - name: Stage the application bundles
        env:
          APPLICATIONS: ${{ runner.temp }}/applications
          STAGING: ${{ runner.temp }}/snapshot
        run: |
          set -euo pipefail
          mkdir -p "$STAGING"
          find "$APPLICATIONS" -type f \( -name 'iznik-*.tar.gz' -o -name 'iznik-*.zip' \) -exec cp '{}' "$STAGING/" ';'
          test "$(find "$STAGING" -maxdepth 1 -type f -name 'iznik-*.tar.gz' | wc -l)" -eq 3
          test "$(find "$STAGING" -maxdepth 1 -type f -name 'iznik-*.zip' | wc -l)" -eq 1

      - name: Replace the trusted rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: develop-snapshot
          SNAPSHOT_TITLE: Iznik develop snapshot
        run: |
          set -euo pipefail
          notes="Rolling GPUI application candidate from develop commit $GITHUB_SHA. Linux, macOS and Windows client archives are replaced after each successful build; this is not a stable release. The Windows client is a zip of the executable and the servers it can install on a remote host. It is unsigned, and it opens one ssh per command because Win32-OpenSSH cannot multiplex."
          if gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --title "$SNAPSHOT_TITLE" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --title "$SNAPSHOT_TITLE" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          while IFS= read -r asset; do
            gh release delete-asset "$SNAPSHOT_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done < <(gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(test("^iznik-.*\\.(tar\\.gz|zip)$"))')
          gh release upload "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/snapshot/* --clobber
