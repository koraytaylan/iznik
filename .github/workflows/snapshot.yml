# Publish the latest verified develop artifacts as one rolling prerelease.
#
# The release keeps a stable download URL while its tag and assets move with
# each successful develop build. Stable versioned releases remain separate.
name: snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux distribution artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install the native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          if ! command -v zig >/dev/null 2>&1; then
            sudo snap install zig --classic
          fi
          zig version

      - name: Provide the cross linkers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iznik-tools"
          cat > "$RUNNER_TEMP/iznik-tools/aarch64-linux-musl-gcc" <<'SCRIPT'
          #!/usr/bin/env bash
          exec zig cc -target aarch64-linux-musl "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/iznik-tools/aarch64-linux-musl-gcc"
          echo "$RUNNER_TEMP/iznik-tools" >> "$GITHUB_PATH"

      - name: Build the Linux artifacts
        run: |
          cargo xtask distribution --target x86_64-unknown-linux-musl
          cargo xtask distribution --target aarch64-unknown-linux-musl

      - name: Upload the Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-linux
          if-no-files-found: error
          path: target/distribution

  darwin:
    name: Darwin distribution artifacts
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Zig
        run: |
          brew install zig
          zig version

      - name: Point at the SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build the Darwin artifacts
        run: |
          cargo xtask distribution --target aarch64-apple-darwin
          cargo xtask distribution --target x86_64-apple-darwin

      - name: Upload the Darwin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-darwin
          if-no-files-found: error
          path: target/distribution

  publish:
    name: Replace the rolling prerelease
    needs: [linux, darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the verified distribution artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/distributions

      - name: Package uniquely named archives
        env:
          DISTRIBUTIONS: ${{ runner.temp }}/distributions
          STAGING: ${{ runner.temp }}/snapshot
        run: |
          set -euo pipefail
          mkdir -p "$STAGING"
          while IFS= read -r manifest; do
            target=$(basename "$(dirname "$manifest")")
            archive="iznik-${target}.tar.gz"
            tar -czf "$STAGING/$archive" -C "$(dirname "$manifest")" \
              iznik-server SHA256SUMS manifest.toml
          done < <(find "$DISTRIBUTIONS" -type f -name manifest.toml -print)
          test "$(find "$STAGING" -maxdepth 1 -type f -name 'iznik-*.tar.gz' | wc -l)" -eq 4

      - name: Replace the trusted rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: develop-snapshot
          SNAPSHOT_TITLE: Iznik develop snapshot
        run: |
          set -euo pipefail
          notes="Rolling candidate from develop commit $GITHUB_SHA. Assets are replaced after each successful build; this is not a stable release."
          if gh release view "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SNAPSHOT_TAG}" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --title "$SNAPSHOT_TITLE" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" --title "$SNAPSHOT_TITLE" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload "$SNAPSHOT_TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/snapshot/* --clobber
