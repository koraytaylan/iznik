[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
iznik-harness = { path = "../crates/iznik-harness" }
syn = { version = "=2.0.119", features = ["full", "visit"] }
# `derive` is beyond the architecture's feature list: the claims registry is
# deserialized by derived implementations.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.9.12"
sha2 = "=0.11.0"
# Without its default features: the library, not the clap-driven binary.
cbindgen = { version = "=0.29.4", default-features = false }
