# The iznik workspace.
#
# Every member, every module declaration and every dependency the six plans
# under docs/plans/ need is declared by the scaffold (task workspace-scaffold);
# no later task adds a member, a module or a dependency, so every task's
# footprint stays disjoint and the dependency gate is an equality. The lint
# table is CONTRIBUTING.md section 3 made executable, decided once here so that
# no task ever edits it; its thresholds are in clippy.toml.

[workspace]
resolver = "3"
members = [
    "crates/iznik-protocol",
    "crates/iznik-link",
    "crates/iznik-server",
    "crates/iznik-client",
    "crates/iznik-ffi",
    "crates/iznik-cli",
    "crates/iznik-harness",
    "crates/iznik-testkit",
    "crates/iznik-regression",
    "crates/iznik-app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

# Optimized enough to measure, fast enough to rebuild on every task, with the
# registry's debug-only model validation still on inside the containers.
# `strip = false` is the one field beyond the architecture's list: the profile
# inherits `strip = true` from release, which would discard the line tables the
# `debug` field asks for.
[profile.regression]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"
debug-assertions = true
strip = false

# Used only by `xtask distribution`: a fat-LTO build of the server takes
# minutes, and nothing but a shipped artifact needs it.
[profile.release]
strip = true
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
dead_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
assertions_on_result_states = "deny"
create_dir = "deny"
dbg_macro = "deny"
deref_by_slicing = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "deny"
filetype_is_file = "deny"
format_push_string = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
min_ident_chars = "deny"
missing_assert_message = "deny"
missing_docs_in_private_items = "deny"
mixed_read_write_in_expression = "deny"
multiple_unsafe_ops_per_block = "deny"
needless_raw_strings = "deny"
non_ascii_literal = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
pub_without_shorthand = "deny"
redundant_type_annotations = "deny"
ref_patterns = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
shadow_unrelated = "deny"
single_char_lifetime_names = "deny"
str_to_string = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unicode_not_nfc = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_self_imports = "deny"
unreachable = "deny"
unseparated_literal_suffix = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
