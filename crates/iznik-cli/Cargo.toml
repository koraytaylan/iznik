[package]
name = "iznik-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "iznik"
path = "src/main.rs"
# The `iznik` library of `iznik-ffi` owns the documentation name `iznik`.
doc = false

[dependencies]
iznik-client = { path = "../iznik-client" }
iznik-protocol = { path = "../iznik-protocol" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
serde_json = "=1.0.151"

[dev-dependencies]
iznik-testkit = { path = "../iznik-testkit" }
