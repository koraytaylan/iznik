[package]
name = "iznik-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
iznik-protocol = { path = "../iznik-protocol" }
iznik-link = { path = "../iznik-link" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "process", "net", "io-util", "sync", "time", "macros", "fs"] }
nix = { version = "=0.31.3", features = ["user"] }
sha2 = "=0.11.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
iznik-testkit = { path = "../iznik-testkit" }
# For its bounded process runner only: the terminfo asset is proven by running
# the same `tic` and `infocmp` a host would, and section 8's rule is that no
# spawned process runs without a deadline.
iznik-harness = { path = "../iznik-harness" }
