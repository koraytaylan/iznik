[package]
name = "iznik-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "iznik"
# `rlib` beside the two the application links, so that this crate's own cases
# can call the `extern "C"` functions the way a C program does: without it
# there is no way to test the boundary from inside the workspace.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
iznik-client = { path = "../iznik-client" }
iznik-protocol = { path = "../iznik-protocol" }
# The inherited-master handle is a `portable-pty` master. The package is
# already what the server uses; this crate is where the unsafe ownership lives.
anyhow = "=1.0.104"
libc = "=0.2.189"
portable-pty = "=0.9.0"

[dev-dependencies]
iznik-testkit = { path = "../iznik-testkit" }
# For the host a case scripts on a socket, to lose a link on cue.
iznik-link = { path = "../iznik-link" }
# For the runtime the cases stand a daemon up on. Nothing in `src/` uses it:
# the boundary owns no runtime, the engine behind it does.
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net"] }
