# The test runner's deadlines: a hung test cannot hold the suite.

[profile.default]
retries = 0
fail-fast = false
# A test over five seconds is printed as SLOW and is a review rejection; one
# over sixty is killed and reported by name.
slow-timeout = { period = "5s", terminate-after = 12 }

# Before the rule below, because nextest takes the first override that matches
# and this needs a longer deadline than that one gives.
#
# Every distribution case builds a release artifact, and two cargo invocations
# at once wait on each other for the package-cache lock, so they run one at a
# time and a wait is not counted against a deadline. Ninety minutes, rather
# than the ten every other `regression_*` binary gets: a release build of this
# workspace is fat link-time optimization at one codegen unit, for one or two
# musl targets, and on a cold cache it builds the emulator with Zig after
# cloning it. `linux.rs` budgets thirty minutes for exactly that, and a runner
# that killed the case at ten would be reporting the machine rather than the
# artifact. Ninety is above what one case may spend inside its own deadlines:
# two thirty-minute builds and a clean between them.
[[profile.default.overrides]]
filter = 'binary(/^regression_distribution_/)'
test-group = 'distribution'
slow-timeout = { period = "120s", terminate-after = 45 }
# And with the machine to itself. A release build of this workspace is fat
# link-time optimization at one codegen unit and takes every core it can get;
# beside it, a test that waits for a shell to print a prompt is measuring the
# build. `xtask claims coverage` runs every proof there is, so without this a
# distribution case and a pane case are always running at once, and the pane
# case is the one that fails.
threads-required = 'num-cpus'

# Test binaries that start containers, build release artifacts or measure over
# a window are named regression_*, are ignored, and get longer deadlines.
[[profile.default.overrides]]
filter = 'binary(/^regression_/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Every scenario owns three containers, each running real shells over real
# SSH — the same thing the server's own tests do, one layer down. They share
# the group below, and each counts for three of it, because they are the same
# load and not the same size: `xtask claims coverage` runs every proof there
# is, and four scenarios beside four shell-driving tests is twelve containers
# and their shells at once, which starves one of them past a deadline meant to
# catch a hang rather than to measure a machine.
[[profile.default.overrides]]
filter = 'test(/^scenario::/)'
test-group = 'shells'
threads-required = 3

# A timing measurement never shares the machine with the rest of the suite.
[[profile.default.overrides]]
filter = 'test(/latency|throughput|baseline/)'
threads-required = 'num-cpus'

# Every test in the server crate drives a real shell on a real pseudoterminal
# and waits on what it prints, so what it measures is not its own work but the
# machine's willingness to run a shell. Sixteen of those at once, beside the
# rest of the suite, starves one past its own deadline and turns the suite's
# parallelism into a failure rather than a slower run. Four at a time — the
# scenarios included, above — keeps a wait a wait.
[[profile.default.overrides]]
filter = 'package(iznik-server)'
test-group = 'shells'

# The fixture reaper removes every labelled container and network, a sibling
# test's live fixture included, so it runs with the machine to itself.
[[profile.default.overrides]]
filter = 'test(/regression_fixture_reaper_/)'
threads-required = 'num-cpus'

[test-groups.shells]
max-threads = 4

# `xtask claims verify` reads the outcome of every proof from this report.
[profile.claims.junit]
path = "claims.xml"

[test-groups.distribution]
max-threads = 1
