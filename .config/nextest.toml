# The test runner's deadlines: a hung test cannot hold the suite.

[profile.default]
retries = 0
fail-fast = false
# A test over five seconds is printed as SLOW and is a review rejection; one
# over sixty is killed and reported by name.
slow-timeout = { period = "5s", terminate-after = 12 }

# Test binaries that start containers, build release artifacts or measure over
# a window are named regression_*, are ignored, and get longer deadlines.
[[profile.default.overrides]]
filter = 'binary(/^regression_/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Every scenario owns three containers; four at a time keeps podman contention
# out of the scenario overhead ceiling.
[[profile.default.overrides]]
filter = 'test(/^scenario::/)'
test-group = 'scenarios'

# A timing measurement never shares the machine with the rest of the suite.
[[profile.default.overrides]]
filter = 'test(/latency|throughput|baseline/)'
threads-required = 'num-cpus'

# Every test in the server crate drives a real shell on a real pseudoterminal
# and waits on what it prints, so what it measures is not its own work but the
# machine's willingness to run a shell. Sixteen of those at once, beside the
# rest of the suite, starves one past its own deadline and turns the suite's
# parallelism into a failure rather than a slower run. Four at a time keeps a
# wait a wait.
[[profile.default.overrides]]
filter = 'package(iznik-server)'
test-group = 'shells'

# The fixture reaper removes every labelled container and network, a sibling
# test's live fixture included, so it runs with the machine to itself.
[[profile.default.overrides]]
filter = 'test(/regression_fixture_reaper_/)'
threads-required = 'num-cpus'

[test-groups.scenarios]
max-threads = 4

[test-groups.shells]
max-threads = 4

# `xtask claims verify` reads the outcome of every proof from this report.
[profile.claims.junit]
path = "claims.xml"

# Every distribution case builds a release artifact, and two cargo invocations
# at once contend on the package-cache lock and one of them fails. They run one
# at a time.
[[profile.default.overrides]]
filter = 'binary(/^regression_distribution_/)'
test-group = 'distribution'

[test-groups.distribution]
max-threads = 1
