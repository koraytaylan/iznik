name = "unreachable-host"
claims = ["doctor-names-the-layer-that-could-not-be-reached"]
driver = "engine"
budget_seconds = 90
exclusive = false

[setup]
hosts = 1
files = []

# A host that is not there. A failure is not an ending — a host that could not
# be reached is tried again, and one that failed once may connect on the next
# attempt — but the same failure twice is the host saying what it is, and the
# step's timeout is what holds it to answering rather than waiting out its own
# ceiling.
[[steps]]
id = "a-host-that-is-not-there"
container = "engine"
run = "IZNIK_ARTIFACTS_DIRECTORY=/iznik/distribution /iznik/bin/iznik doctor nosuchhost"
timeout_seconds = 30

[[expect]]
step = "a-host-that-is-not-there"
exit = 0
stdout_contains = "\"layer\":\"transport\""

[[expect]]
step = "a-host-that-is-not-there"
exit = 0
stdout_contains = "\"skipped\""
