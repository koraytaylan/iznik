name = "short-soak"
claims = ["soak-holds-a-flooded-pane-across-a-drop", "soak-weighs-what-is-running"]
driver = "engine"
budget_seconds = 300
exclusive = true

[setup]
hosts = 2
files = []

# What the soak does for hours, once: a pane flooded through a client that
# returns credit for what it takes, the link dropped underneath it, and the
# stream picked up where it stopped. Exclusive because the weighing below is
# of a whole container, and a second scenario running beside it would be
# weighed too.
[[steps]]
id = "flood-a-held-pane"
container = "engine"
timeout_seconds = 80

[steps.client]
command = "ssh -o BatchMode=yes host0 /iznik/bin/iznik-server --stdio"
until_quiet_milliseconds = 400
actions = [
  { kind = "hello" },
  { kind = "auto_credit", on = true },
  { kind = "create_session", name = "soak", columns = 80, rows = 24 },
  { kind = "subscribe", pane = 1 },
  { kind = "input", pane = 1, text = "seq 1 20000\n" },
  { kind = "await_bytes", pane = 1, contains = "19999" },
  { kind = "screen_to", pane = 1, path = "/tmp/short-soak-screen.bin" },
  { kind = "capture_to", pane = 1, path = "/tmp/short-soak-first.bin" },
  { kind = "resume_point_to", pane = 1, path = "/tmp/short-soak-point.txt" },
]

[[steps]]
id = "drop-the-link"
container = "host0"
fault = "disconnect-network"
timeout_seconds = 15

[[steps]]
id = "make-it-good"
container = "host0"
fault = "reconnect-network"
timeout_seconds = 15

# The half that makes the flood mean something: what arrives after the drop
# begins where what arrived before it ended, and the three pieces reassemble
# into one stream.
[[steps]]
id = "lose-no-byte"
container = "engine"
timeout_seconds = 80

[steps.client]
command = "ssh -o BatchMode=yes -o ConnectTimeout=10 host0 /iznik/bin/iznik-server --stdio"
until_quiet_milliseconds = 400
actions = [
  { kind = "hello" },
  { kind = "auto_credit", on = true },
  { kind = "resume", pane = 1, from_file = "/tmp/short-soak-point.txt" },
  { kind = "input", pane = 1, text = "echo after-the-drop\n" },
  { kind = "await_bytes", pane = 1, contains = "after-the-drop" },
  { kind = "capture_to", pane = 1, path = "/tmp/short-soak-second.bin" },
  { kind = "expect_reassembly", pane = 1, pieces = ["/tmp/short-soak-screen.bin", "/tmp/short-soak-first.bin", "/tmp/short-soak-second.bin"] },
]

# And the churn the soak runs beside it, on the other host: a session made,
# used and unmade while the pane above is held.
[[steps]]
id = "churn-the-other-host"
container = "engine"
run = "IZNIK_ARTIFACTS_DIRECTORY=/iznik/distribution /iznik/bin/iznik benchmark host1"
timeout_seconds = 50

# The soak's own instrument, in the containers it runs in: what the daemon
# weighs, read out of `/proc` because the engine image has no `ps` at all. The
# relay is left out by name — a host runs one daemon and one `--stdio` relay
# per client connection and both are called `iznik-server`, so a weighing that
# took the first one it found would be of the daemon at one sample and of a
# relay at the next.
#
# The line that reads the resident size is the soak's own `WEIGH`, word for
# word, with the name filled in; a case holds the two texts together, because
# a census transcribed into a scenario is a replica and a replica proves
# nothing about the one a soak runs.
#
# A relay is held open for the counting by a `sleep` holding the write end of
# a pipe, with the whole group's output redirected so that the backgrounded
# sleep does not keep the step's own standard error open for twenty seconds
# after the step is done — which would leave every run of it annotated as
# incomplete and hide the one thing that stream is for: the `awk: can't open`
# lines from a process that exited between being named and being weighed.
# Without a relay there is nothing to leave out, and a weighing that dropped
# the guard would count the same.
[[steps]]
id = "weigh-the-daemon"
container = "host0"
run = "for held in /proc/[0-9]*; do if grep -qsx iznik-server \"$held/comm\"; then binary=$(readlink \"$held/exe\"); break; fi; done; { sleep 20 | \"$binary\" --stdio; } > /dev/null 2>&1 & sleep 2; servers=0; daemons=0; for held in /proc/[0-9]*; do if grep -qsx iznik-server \"$held/comm\"; then servers=$((servers + 1)); if ! grep -qsa -- --stdio \"$held/cmdline\"; then daemons=$((daemons + 1)); fi; fi; done; total=$(for held in /proc/[0-9]*; do if grep -qsx iznik-server \"$held/comm\" && ! grep -qsa -- --stdio \"$held/cmdline\"; then awk '/VmRSS/{print $2}' \"$held/status\"; fi; done | awk '{total += $1} END {print total + 0}'); printf 'servers:%s daemons:%s resident-kibibytes:%s\n' \"$servers\" \"$daemons\" \"$total\""
timeout_seconds = 45

[[expect]]
step = "flood-a-held-pane"
exit = 0

[[expect]]
step = "lose-no-byte"
exit = 0

[[expect]]
step = "churn-the-other-host"
exit = 0
stdout_contains = "\"median\""

# Two processes answering to `iznik-server`, exactly one of them a daemon:
# the census found a relay and left it out, which is the whole of what the
# soak's weighing has to get right. Dropping the guard makes this `daemons:2`.
[[expect]]
step = "weigh-the-daemon"
exit = 0
stdout_contains = "servers:2 daemons:1"

# And a resident size that was really read. The census prints a nought when
# it finds nothing, so the expectation asks for a number that is not one:
# this cannot be met by the format string, nor by a census that matched
# nothing at all.
[[expect]]
step = "weigh-the-daemon"
exit = 0
stdout_matches = "resident-kibibytes:[1-9][0-9]*"
