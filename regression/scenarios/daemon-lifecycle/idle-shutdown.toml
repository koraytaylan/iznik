name = "idle-shutdown"
claims = ["daemon-idle-shutdown"]
driver = "engine"
budget_seconds = 60
exclusive = false

[setup]
hosts = 1
files = []

[[steps]]
id = "start-briefly"
container = "engine"
run = "ssh -o BatchMode=yes host0 /iznik/bin/iznik-server --daemon --idle-shutdown-seconds 1 && printf started"
timeout_seconds = 20

[[steps]]
id = "it-goes-on-its-own"
container = "engine"
run = "ssh -o BatchMode=yes host0 'socket=\"${XDG_RUNTIME_DIR:-/tmp/iznik-$(id -u)}/iznik/server.sock\"; for turn in $(seq 30); do test -S \"$socket\" || { printf gone; exit 0; }; sleep 1; done; printf still-there; exit 1'"
timeout_seconds = 35

[[expect]]
step = "start-briefly"
exit = 0
stdout_equals = "started"

[[expect]]
step = "it-goes-on-its-own"
exit = 0
stdout_equals = "gone"
