# Any number of clients, each with its own multiplexer and its own focus, all
# seeing the same model — and a client that disconnects leaving nothing behind.
#
# The loop is written over any duplex stream, so every claim here is proven
# over a socket pair: no daemon, no socket file, no process. The same
# behaviour through the daemon, the relay and over real SSH is proven by
# `daemon-lifecycle`, `stdio-relay` and `integration-harness`.

[[claim]]
id = "connection-refuses-what-it-cannot-speak"
statement = "A first frame that is not a `Hello` is dropped without an answer, because a peer that speaks garbage is not making a request; a `Hello` carrying a protocol version this server does not speak is answered with `Error { ProtocolVersion }` and closed; a good one leaves a connection that answers."
test = "iznik-server::client_connections::the_handshake_refuses_what_it_cannot_speak"
because = "the handshake is a property of the loop and the stream under it, and a socket pair is a stream"

[[claim]]
id = "connection-advertises-reordering-sessions"
statement = "The server advertises `REORDER_SESSIONS` in its `Hello`, and answers a `ReorderSessions` command carrying the host's whole session order with `Applied`."
test = "iznik-server::client_connections::the_handshake_advertises_reordering_sessions"
because = "what the server says it can decode and what it does with the command are both properties of the loop and the stream under it, and a socket pair is a stream"

[[claim]]
id = "connection-refuses-an-unknown-command"
statement = "A `Command` carrying a tag this server does not know is answered with `CommandResult { Rejected { UnknownCommand } }` and the connection stays usable — because two peers of one protocol version are not necessarily one build, and ending the link over one unknown tag would take every pane on it with it."
test = "iznik-server::client_connections::an_unknown_command_is_refused_without_ending_the_connection"
because = "a hand-written command frame is the only way to send a tag no codec builds, which is exactly what a peer of another build sends"

[[claim]]
id = "connection-clients-see-one-model"
statement = "A session created by one client reaches another as the same delta carrying the same generation, and a resize by one reaches both as `PaneResized` — including when neither is subscribed to the pane, because the registry is told when a pane has something to report rather than polled or left unread."
test = "iznik-server::client_connections::two_clients_see_one_model"
because = "two connections over two socket pairs are two connections; a network between them adds latency, not agreement"

[[claim]]
id = "connection-input-reaches-the-pane"
statement = "Bytes one client sends as `Input` are written to the pane's shell and their echo arrives on another client's subscribed channel, so a pane is one shell and not one per connection."
test = "iznik-server::client_connections::input_reaches_the_pane_and_comes_back"
because = "the shell is a real process here; only the wire between it and the client is shortened"

[[claim]]
id = "connection-reports-a-backlog"
statement = "Input beyond what a pane whose shell has stopped reading can hold is answered with `Error { InputBacklog }` naming the pane, and the connection stays open: nothing is dropped and nothing is lost."
test = "iznik-server::client_connections::a_backlog_is_reported_and_the_connection_stays_open"
because = "the backlog is the pane's own limit against a real pseudoterminal that is not being read"

[[claim]]
id = "connection-refuses-without-closing"
statement = "A `Subscribe` for a pane that is not there is answered with `Error { UnknownPane }` and a `Credit` for a channel this connection never carried with `Error { NotSubscribed }`, and the connection stays open — a well-formed request that is wrong is refused, not disconnected."
test = "iznik-server::client_connections::a_wrong_request_is_refused_and_the_connection_stays_open"
because = "the distinction between a wrong request and a broken peer is the loop's, and needs nothing outside it"

[[claim]]
id = "connection-garbage-closes-one-connection"
statement = "A frame that does not decode closes the connection that sent it and no other: a peer that speaks garbage is disconnected, and every other client carries on."
test = "iznik-server::client_connections::garbage_closes_only_that_connection"
because = "two connections over two socket pairs are as independent as two over a network"

[[claim]]
id = "connection-a-disconnect-leaves-nothing"
statement = "A client that drops without unsubscribing leaves no subscription behind — observable because the pane's mirror answers a program's cursor-position query again, which it does only when nobody is watching — and no channel: the next client is given the first channel number."
test = "iznik-server::client_connections::a_disconnect_leaves_nothing_behind"
because = "the query policy is the mirror's own, driven by a real shell in this process"

[[claim]]
id = "connection-compression-is-what-was-agreed"
statement = "A connection whose handshake agreed on compression carries control messages, commands and a whole model, and so does one whose handshake did not: were the two ends to disagree about the layer, nothing after the handshake would decode at all."
test = "iznik-server::client_connections::compression_is_what_both_ends_agreed_on"
because = "both ends of the layer are in this process, which is exactly what makes a disagreement observable"

[[claim]]
id = "connection-has-one-writer"
statement = "A thousand keystroke-sized round trips interleaved with a pane's flood produce a stream in which every frame decodes and every answer is present, because one task owns the link's writer and two never race for it."
test = "iznik-server::client_connections::one_writer_keeps_the_stream_well_formed"
because = "the interleaving is between two producers inside one connection, and a network would only reorder what it already carries in order"

[[claim]]
id = "connection-a-dispatcher-that-gives-up-closes-it"
statement = "A connection whose dispatcher has given up — on a second `Hello`, or on any refusal that is not the client's to fix — is closed rather than left holding a socket the client waits on for an answer that is never coming."
test = "iznik-server::client_connections::a_dispatcher_that_gives_up_closes_the_connection"
because = "what is proven is that one task ending ends the others, which is inside one process by construction"

[[claim]]
id = "connection-a-pane-that-exits-reaches-every-client"
statement = "A pane whose shell exits is taken out of the model every client holds, with nothing but the registry's own signal driving the ingestion — no daemon, no accept loop and no timer."
test = "iznik-server::client_connections::a_pane_that_exits_reaches_every_client"
because = "the point is that nothing outside the connection drives it, which a daemon in a container would hide"
