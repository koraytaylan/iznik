# The C ABI over the client engine.
#
# `test` proofs, called through the `extern "C"` functions themselves rather
# than through the Rust behind them: what is asserted is what an application
# sees. The host is a `unix:` alias to a daemon on this machine, because the
# boundary is what is being proven and the network is `end-to-end-ssh`'s. The
# same functions against a real C compiler and a real linker are
# `static-library-and-header`'s, one workstream on.

[[claim]]
id = "ffi-makes-and-ends-a-client"
statement = "A null configuration makes a client with every default; one naming a runtime directory that cannot be made answers null and says so against the client's own layer, with a message to read; freeing null is nothing."
test = "iznik-ffi::ffi_surface::ffi_surface_makes_and_ends_a_client"
because = "the boundary is the same boundary whatever calls it, and what is proven is what it answers"

[[claim]]
id = "ffi-carries-events-and-commands"
statement = "Adding a `unix:` host produces a host-state event and then a snapshot whose payload decodes with `iznik-protocol` itself — one schema, not two — and a `CreateSession` sent in encoded comes back with a number of its own, answered by a command result carrying that number and followed by the session's deltas. The buffer the command was in may be freed as soon as the call returns."
test = "iznik-ffi::ffi_surface::ffi_surface_carries_events_and_commands"
because = "the daemon behind it is real and the encoding is the wire's; only the socket is shorter than a network"

[[claim]]
id = "ffi-calls-back-on-one-thread"
statement = "Every callback arrives on one thread, asserted by its identity, so an application keeping state in its handler needs no lock for it; and a client with a host on it ends inside a second."
test = "iznik-ffi::ffi_surface::ffi_surface_calls_back_on_one_thread_and_ends_quickly"
because = "which thread a call arrives on is a property of this library, and a container would not make it truer"

[[claim]]
id = "ffi-says-which-layer-failed"
statement = "Every refusal carries a layer and words: a call with no host named is the client's own, and a host that cannot be reached is the transport's, naming the host. The first question anybody asks about a system this tall is which part of it broke."
test = "iznik-ffi::ffi_surface::ffi_surface_says_which_layer_failed"
because = "the layer is decided here, from what the engine reported, and no host is needed to read the answer"

[[claim]]
id = "surface-numbers-the-model-it-hands-over"
statement = "A snapshot and a change each say which generation they are, because the encoded change does not carry the number and `iznik_protocol`'s own `apply` will not take one without it — so an application keeping a model of its own can apply what it is handed, and can tell that nothing was missed."
test = "iznik-ffi::ffi_surface::ffi_surface_carries_events_and_commands"
because = "the number is put into the event beside the bytes, and what it must equal is what the same bytes decode to"

[[claim]]
id = "surface-writes-the-log-it-was-given"
statement = "A log named in the configuration is written, under a directory that did not exist yet, and says what happened to a host — which is the only account of a run a native application can hand over without having kept one itself."
test = "iznik-ffi::ffi_surface::ffi_surface_writes_the_log_it_was_given"
because = "a file on this machine is the same file anywhere, and the host it is about is a whole daemon reached through `unix:`"

[[claim]]
id = "surface-refuses-a-log-it-cannot-write"
statement = "A log that cannot be opened is a refusal naming the file, not a client that quietly writes nowhere — because the one moment somebody discovers an empty log is the moment they are looking for the reason something failed."
test = "iznik-ffi::ffi_surface::ffi_surface_refuses_a_log_it_cannot_write"
because = "the file is refused by this machine's own filesystem, which refuses it the same way anywhere"

[[claim]]
id = "surface-refuses-a-second-log"
statement = "Where this process writes what iznik says is settled once and outlives the client that asked for it, so a second client naming a second file is refused — naming both, and leaving nothing at the file it would not write. The same file again is what the process already has, and is no refusal at all."
test = "iznik-ffi::ffi_surface::ffi_surface_refuses_a_second_log"
because = "one subscriber to a process is the logging library's rule wherever it runs, and both files are on this machine"

[[claim]]
id = "surface-names-a-pane-and-the-size-its-screen-was-drawn-at"
statement = "A pane's screen carries the pane it belongs to and the size it was drawn at, because a surface reset to the wrong size puts every byte after it in the wrong cell — and the size a pane was last told to be is not always the size the screen in hand was drawn at. A pane that has gone has a kind of its own and names itself, rather than arriving as a sentence about the host's state that a person would read where the connection belongs."
test = "iznik-ffi::ffi_surface::ffi_surface_names_a_pane_and_the_size_its_screen_was_drawn_at"
because = "what each kind carries is this boundary's own shaping, and the pane behind it is a real shell on a real pseudoterminal"
