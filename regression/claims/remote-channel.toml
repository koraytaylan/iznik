# One channel to one host, and what it does when the host stops answering.
#
# The handshake, the version refusal and the liveness are `test` proofs over
# the `unix:` alias, because a socket on this machine is the same link the SSH
# path builds and a container would only make it longer. What needs SSH — the
# channel opened through `iznik-server --stdio` on a real host, and a server
# that stops answering under a held subscription — is a scenario.
#
# That last one stops the daemon rather than cutting the network, and the claim
# says so. The fixture applies a fault between steps, and a channel cannot
# outlive the process that opened it, so a network cut between steps would be
# met by the opening of a second channel rather than by the silence of the
# first; neither container carries the traffic tooling to cut it from inside a
# step. A stopped daemon over a healthy link is the same silence from the
# channel's side, which is the side this task is about.

[[claim]]
id = "channel-shakes-hands-with-the-daemon"
statement = "A channel opened to a daemon over a local socket completes the handshake, agrees with it about the protocol version, and hears the compression it asked for offered back."
test = "iznik-client::remote_channel::a_channel_shakes_hands_with_the_daemon"
because = "a socket on this machine is the same link the SSH path builds, and the handshake is the same bytes either way"

[[claim]]
id = "channel-refuses-another-protocol-version"
statement = "A server that says it speaks another protocol version is refused by name, with the version it said and the host it is — because the daemon holds the sessions and is never replaced without being asked."
test = "iznik-client::remote_channel::a_channel_refuses_another_protocol_version"
because = "the server is written to say the wrong thing, which no real daemon does and no container could arrange"

[[claim]]
id = "channel-notices-silence-at-once"
statement = "A link that has stopped answering is reported dead within its pong deadline and one ping interval — under a second where the timings are set in hundreds of milliseconds — naming the host and how long it was silent."
test = "iznik-client::remote_channel::a_silent_link_is_dead_within_its_deadline"
because = "what is proven is a deadline this client imposes, and a server that answers nothing is the same silence over any transport"

[[claim]]
id = "channel-carries-what-the-server-answers"
statement = "A request sent on the channel comes back answered on the control channel, decoded as the message it was asked for."
test = "iznik-client::remote_channel::a_channel_carries_what_the_server_answers"
because = "the daemon behind it is the real one; only the socket is shorter than a network"

[[claim]]
id = "channel-shakes-hands-over-ssh"
statement = "From the engine container, a channel opened through `ssh host0 iznik-server --stdio` completes the handshake and reports the protocol version it agreed on."
scenario = "handshake-over-ssh"

[[claim]]
id = "channel-carries-a-pane-over-ssh"
statement = "Over that channel a session is made, a pane subscribed, a line typed, and the line comes back on the pane's own channel."
scenario = "bytes-over-ssh"

[[claim]]
id = "channel-notices-a-dead-link"
statement = "Over real SSH, with the daemon on the host stopped where it stands under a held subscription — the link healthy and answering nothing — the channel delivers what was already in flight and then reports itself dead inside the deadline it was given, and a new channel opens once the daemon is let go."
scenario = "dead-link-noticed"

[[claim]]
id = "channel-carries-a-pane-byte-for-byte"
statement = "A subscribed pane's bytes arrive on the channel that was announced for it, from the sequence that announcement named, carrying what the program printed rather than the echo of what was typed."
test = "iznik-client::remote_channel::a_channel_carries_a_pane_byte_for_byte"
because = "the pane is a real shell on a real pseudoterminal behind a real daemon; only the socket is shorter than a network"

[[claim]]
id = "channel-compresses-only-when-the-server-does"
statement = "A server that offers no compression is taken at its word and the link stays plain; the daemon, which offers it, is met with it — and a request still comes back answered through it."
test = "iznik-client::remote_channel::a_channel_compresses_only_when_the_server_does"
because = "the server that declines is written to decline, which no real daemon does and no container could arrange"
