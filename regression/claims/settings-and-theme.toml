[[claim]]
id = "settings-theme-conversion"
statement = "Theme conversion preserves application foreground and background in emulator defaults."
test = "iznik-app::settings::theme_reaches_terminal_defaults"
because = "The conversion is pure state mapping and needs no container."

[[claim]]
id = "settings-refusal-preserves"
statement = "Malformed keybinding updates are refused while previous settings remain unchanged."
test = "iznik-app::settings::malformed_keybinding_is_refused"
because = "Validation and replacement are local settings state."

[[claim]]
id = "settings-overrides-closed"
statement = "Keybinding overrides reject unknown actions and colliding chords against the closed inventory."
test = "iznik-app::settings::overrides_validate_against_inventory"
because = "Inventory validation is local application state."

[[claim]]
id = "settings-watcher-applies"
statement = "The settings watcher applies a changed file once and ignores an unchanged modification stamp."
test = "iznik-app::settings::watcher_applies_changed_file"
because = "File stamp handling is deterministic local state."

[[claim]]
id = "settings-live-emulator"
statement = "A changed application theme reaches a live emulator snapshot without restarting the pane."
test = "iznik-app::settings::theme_change_reaches_live_emulator"
because = "The test drives the in-process VT owner directly and needs no external host."

[[claim]]
id = "settings-ayu-mirage-default"
statement = "Every bundled theme family registers, and the bundled Ayu Mirage theme becomes the application's default dark theme."
test = "iznik-app::theme::ayu_mirage_becomes_the_default_theme"
because = "Theme registration and selection are local kit state, no container needed."

[[claim]]
id = "settings-window-opens"
statement = "Choosing \"iznik: settings\" from the palette opens a window with its own title bar and close button, rendering the Appearance settings panel, with a theme selector and a bounded font-size number input, over the shell's live theme."
test = "iznik-app::settings_window::settings_action_opens_a_window"
because = "The test drives the palette and GPUI's headless window layer directly and needs no container."

[[claim]]
id = "settings-metrics-reach-pane"
statement = "A changed theme's font family and size reach a retained pane's grid immediately, re-measuring its cell width and line height from the new font instead of clipping to the old one's geometry, and also restyle the kit's own general and monospace UI text, not only terminal content."
test = "iznik-app::window_shell::window_propagates_theme_metrics_to_every_pane"
because = "The test drives a real shell and pane over the in-process engine and needs no container."

[[claim]]
id = "settings-metrics-repaint-every-row"
statement = "A grid's `set_metrics` call repaints every retained row, not only rows whose terminal content also changed."
test = "iznik-app::grid_element::grid_repaints_every_row_when_metrics_change"
because = "The test drives a real grid and window layer directly and needs no container."

[[claim]]
id = "settings-chrome-font-matches-at-startup"
statement = "A freshly constructed shell applies its own settings font to the kit's chrome immediately at construction, so the settings window shows the same size the app is actually drawn with from the start, instead of the kit's unrelated built-in default until the first edit."
test = "iznik-app::window_shell::window_starts_with_its_own_settings_font_not_the_chrome_default"
because = "The test drives a real shell construction directly and needs no container."

[[claim]]
id = "failure-banner-is-readable"
statement = "The failure strip paints the selected theme's own surface as an opaque field and, as its text, the danger colour from that same theme that reads best on the field, for every registered theme. Where the theme's own text already clears 4.5:1 the strip does too; a theme whose surface cannot reach that keeps text at least as readable as the rest of the theme. The kit's error alert mixes danger with transparent white, so its own field is nearly transparent."
test = "iznik-app::theme::the_failure_banner_colour_is_readable"
because = "the two colours and their contrast are arithmetic over the registered theme; no display is needed"

[[claim]]
id = "terminal-font-is-monospace"
statement = "The terminal draws with the requested font family when it is installed, and otherwise — the generic monospace name included — with an installed common monospace family."
test = "iznik-app::theme::the_terminal_font_is_an_installed_monospace_family"
because = "resolution is pure over the installed family names"

[[claim]]
id = "settings-persist-across-launch"
statement = "A theme, font size, line height and title-bar choice made in the shell is what the next shell reads from the settings file."
test = "iznik-app::settings::a_changed_theme_is_what_the_next_shell_reads"
because = "The test drives two shells over one settings file and needs no container."

[[claim]]
id = "tabs-in-title-bar"
statement = "With tabs in the title bar turned on, the selected session's tabs are drawn inside the window's title bar and no separate tab bar is drawn."
test = "iznik-app::window_shell::tabs_move_into_the_title_bar_when_asked"
because = "layout is the headless production shell's own rendering"
