# Layout translation is a headless component proof; transport lifecycle remains pending.
[[claim]]
id = "window-weighted-layout"
statement = "The application layout translator renders nested model splits through kit resizable panels, preserves their weight ratios when the window changes size, and applies revised model weights while reusing the supplied pane entities."
test = "iznik-app::window_shell::window_layout_preserves_weights_across_resize_and_reuses_leaf_entities"
because = "actual headless kit layout bounds and entity identities prove this translation; no server behavior or transport lifecycle is claimed"

[[claim]]
id = "window-model-surface-lifetime"
statement = "The production shell consumes a model snapshot and layout delta without replacing the existing pane entity; disconnect and detach events retain native terminal contents for following contiguous bytes, while actual model removal releases the surface."
test = "iznik-app::window_shell::window_model_updates_keep_surface_and_terminal_identity"
because = "synthetic authoritative model and lifecycle events plus the native VT owner prove the local shell decisions; this does not claim real transport resume or channel credit behavior"

[[claim]]
id = "window-model-dimensions-and-banner"
statement = "An authoritative pane-resize delta reaches the initialized native terminal, and the production shell renderer shows the engine's classified connection state in its visible host banner."
test = "iznik-app::window_shell::window_applies_model_dimensions_and_renders_host_state"
because = "headless shell rendering and native terminal snapshots prove model-to-surface routing; competing-client geometry and transport delivery remain separate container proofs"

[[claim]]
id = "window-container-hot-resume"
statement = "The production window creates a session over the fixture's SSH transport, displays its process output, and retains both its pane entity and a client-owned history viewport through link loss and subsequent hot-resumed output."
test = "iznik-app::regression_window::window_container_create_and_hot_resume"
because = "This ignored GPUI regression test owns the standard two-container fixture; the headless window must run on the test host while SSH credentials and the real daemon remain in the containers."

[[claim]]
id = "window-container-cold-resume"
statement = "After five mebibytes of disconnected output exceed the server's four-mebibyte history ring, the production window resets its client-owned history viewport from an authoritative screen and consumes following output at the new sequence baseline."
test = "iznik-app::regression_window::window_container_cold_resume_and_next_output"
because = "The headless GPUI test owns the real two-container fixture and controls a producer inside its host; window rendering cannot run inside the bare musl scenario container."

[[claim]]
id = "window-container-layout-and-geometry"
statement = "Real CreatePane and SetLayout commands change the rendered production window without replacing its existing pane entity; two independently attached windows follow the latest window resize in both their reconciled model and native terminal dimensions."
test = "iznik-app::regression_window::window_container_split_deltas_and_last_resize"
because = "Two headless GPUI windows own independent production engines connected through SSH in the standard two-container fixture, combining actual platform resize callbacks with server delta round trips."

[[claim]]
id = "window-close-quits-only-for-the-main-window"
statement = "A registered window-closed callback fires only for the window it names, not for any other window that closes, so the application can quit specifically when its main window closes rather than only when the last window closes."
test = "iznik-app::lifecycle::only_the_named_window_closing_calls_the_callback"
because = "GPUI's own default quits when the last window closes, which never fires while a secondary window like settings stays open; this proves the additional main-window-specific behavior the binary layers on top."

[[claim]]
id = "window-notification-layer"
statement = "The production window renders the kit's notification layer over its own chrome, so a pushed toast becomes visible without a separate host component."
test = "iznik-app::palette_shortcut::a_chord_with_nothing_to_act_on_shows_a_notice"
because = "the notification layer is local rendering wiring over the kit's Root, no container needed"

[[claim]]
id = "window-focused-pane-chords"
statement = "The visible pane takes keyboard focus, application chords such as ctrl-shift-p reach the shell before a focused terminal consumes them, and ctrl-w is left to the terminal."
test = "iznik-app::window_shell::a_focused_pane_still_lets_chords_reach_the_shell"
because = "key dispatch order and focus are the headless GPUI window's own behavior over a real terminal surface, no container needed"

[[claim]]
id = "window-stage-follows-host"
statement = "With no tab visible the body welcomes when no host is held, describes a host being reached or unreachable with its remedies, and offers a session on a connected empty host, preferring the host added last."
test = "iznik-app::flow::the_stage_follows_the_host_a_person_is_working_with"
because = "the stage is a pure projection over the engine state"

[[claim]]
id = "window-host-banners-read-plainly"
statement = "A host's state reads as a headline naming it with the manager's detail and a tone, and banners appear for every unconnected host except the one the stage describes."
test = "iznik-app::flow::host_states_read_with_the_host_name_and_banners_do_not_repeat_the_stage"
because = "the reading and the banner set are pure over the engine state"

[[claim]]
id = "window-follows-created-tabs-and-panes"
statement = "A tab or pane created from the window is recognised when the model first holds it and not before."
test = "iznik-app::flow::created_tabs_and_panes_are_found_once_present"
because = "expectation resolution is pure over successive model states"

[[claim]]
id = "window-added-host-starts-once-ready"
statement = "A host added from the window becomes ready for its first session only once it is connected and its model has arrived."
test = "iznik-app::flow::an_added_host_starts_once_connected_with_its_model"
because = "readiness is pure over the engine state"

[[claim]]
id = "window-welcome-stage-renders"
statement = "The empty window renders the welcome stage with its Add Host button."
test = "iznik-app::flow::the_empty_window_offers_add_host"
because = "the headless GPUI window renders the production shell with no host"

[[claim]]
id = "window-close-stays-in-session"
statement = "Closing a tab in a later session leaves the window on that session's neighboring tab, and closing its last tab moves to the next session, rather than the first tab of the first session. The close mark does not select the tab it closes."
test = "iznik-app::tab_selection::closing_a_tab_stays_in_its_session"
because = "selection after a removal is the headless production shell applying an authoritative delta; no container is required"

[[claim]]
id = "window-session-keeps-its-tab"
statement = "Switching to another session and back shows the tab that session was left on. A session opened for the first time shows its first tab, and a tab closed while the window is elsewhere yields that session's first remaining tab."
test = "iznik-app::tab_selection::returning_to_a_session_shows_the_tab_it_was_left_on"
because = "per-session tab memory is the headless production shell's own selection; no container is required"

[[claim]]
id = "window-session-tab-survives"
statement = "A new window reading the selection record the previous window wrote opens the tab that was on screen, and another session opens the tab it was left on. A recorded tab the model no longer holds yields that session's first remaining tab."
test = "iznik-app::tab_selection::a_new_window_shows_the_tab_each_session_was_left_on"
because = "the record is a file the headless shell writes and a second shell reads; no container is required"

[[claim]]
id = "window-command-shortcuts"
statement = "Command and a digit opens that tab of the session on screen, and Command with Option and a digit opens that session. Command with Right or Up opens the next tab and Command with Left or Down the previous, wrapping; Command-Option with those arrows does the same for sessions. While Command is held the tab chips show those numbers, and while Command and Option are held the session chips do."
test = "iznik-app::navigation::command_shortcut_moves_between_tabs_and_sessions"
because = "the shortcuts and the numbered chips are the headless production shell's own key dispatch and rendering; no container is required"

[[claim]]
id = "window-command-new-tab"
statement = "Command-T asks the host for a new tab in the session on screen, and the focused terminal does not receive that key."
test = "iznik-app::menu::new_tab_command_asks_the_host_for_a_tab"
because = "the shortcut is the headless production shell's own key dispatch into the menu's New Tab action, over a real terminal surface; no container is required"

[[claim]]
id = "window-close-asks-before-ending-work"
statement = "Closing a tab asks first only when a pane title names a program other than its shell, and closing a session asks first when it holds more than one tab or a program is running. The question names that close on its own button, and cancel is the other answer. Either question can be turned off. An idle shell, and a session of one idle tab, close at once. Both questions are on when the settings file does not mention them."
test = "iznik-app::close_confirmation::closing_asks_for_a_running_program_or_a_session_with_many_tabs"
because = "the question is a pure reading of the model titles and the two settings; no container is required"

[[claim]]
id = "window-close-shows-before-the-host-answers"
statement = "Closing a tab removes it from the window's model before the host answers. A second close of that same tab is not recorded, and the host's own removal still applies without a failure."
test = "iznik-app::close_confirmation::a_close_shows_before_the_host_answers"
because = "the window's model is the engine state's own copy, and the deltas are applied by the same reducer the host's answers go through; no container is required"

[[claim]]
id = "window-command-close"
statement = "Command-W closes the focused pane of the tab on screen. A tab that is running a program is not asked to close as a whole."
test = "iznik-app::menu::close_command_closes_the_focused_pane"
because = "the shortcut is the headless production shell's own key dispatch into the menu's Close Pane action; no container is required"

[[claim]]
id = "window-bounds-survive-relaunch"
statement = "Resizing the main window writes its logical size, and the next launch reads that size back. A recorded position on a display that is still connected is handed back unchanged. A position that meets no connected display opens centered on the primary display at the recorded size, still maximized when that was recorded, and a record larger than the display is fitted to it."
test = "iznik-app::window_bounds::a_resized_window_is_what_the_next_launch_reads"
because = "the record is a file the headless shell writes and the same placement function the launch reads; no container is required"

[[claim]]
id = "window-installs-its-own-main-menu"
statement = "The application installs a main menu of its own at startup, so the system menu bar shows iznik's named menus while an iznik window is frontmost instead of the previous application's menus, and the menu's Paste item sends the clipboard's text to the focused pane through the native encoder."
test = "iznik-app::menu::the_menu_paste_item_reaches_the_focused_pane"
because = "the installed menu bar is local application state the platform reports back, and the focused grid's emitted paste request is the same encoder route proven headlessly; no container or display changes either"

