# Everything the bootstrap needs to know about a host, asked once.
#
# The reading is a pure function over a string, so the machines iznik serves
# and the ones it does not, an installed server and none, `tic` present and
# absent, and each prefix candidate writable or not are `test` proofs: they are
# a table of what a host might say, and a container can only say one of them at
# a time. That the probe is a single round trip is a `test` proof for the same
# reason — counting is what proves it, and a container cannot count.
#
# What the scenarios add is a host that really says these things: one as the
# image leaves it, and one whose home its own user cannot write.

[[claim]]
id = "probe-reads-what-a-host-says"
statement = "A host's answer is read into the machine it is, whether a server is installed at the prefix that was chosen and which, whether the terminal's terminfo and `tic` are there, and where iznik may put things."
test = "iznik-client::host_probe::host_probe_reads_an_ordinary_linux_host"
because = "the answer is a string the host printed, and reading it is the same wherever the string came from"

[[claim]]
id = "probe-knows-the-machines-it-serves"
statement = "Linux and Darwin on x86-64 and aarch64, by every name `uname` gives them, are read; anything else is refused naming what the host said it runs and what it said it is, rather than a server that will not start being discovered later."
test = "iznik-client::host_probe::host_probe_knows_the_machines_it_serves"
because = "the fixture has one architecture and one operating system, and this is about the others"

[[claim]]
id = "probe-takes-the-first-writable-prefix"
statement = "The prefix is the first of the data home, the home's share and the runtime directory that the host says this user may write, and a host that allows none of them is refused naming all three."
test = "iznik-client::host_probe::host_probe_takes_the_first_prefix_the_host_allows"
because = "a container offers one arrangement of the three at a time, and this is about all eight ways their answers combine"

[[claim]]
id = "probe-reads-an-installed-server"
statement = "A server already at the prefix that was chosen is read as its own version and the protocol it speaks; a line that does not begin `iznik-server` is not one, and a version line this cannot read is no server rather than a guess."
test = "iznik-client::host_probe::host_probe_reads_an_installed_server"
because = "an unreadable version line is one no build of this workspace prints, so only a written one can produce it"

[[claim]]
id = "probe-reads-what-the-terminal-needs"
statement = "Whether `tic` is on the path and whether the terminal's terminfo is already installed are read as the host reported them, in all four combinations."
test = "iznik-client::host_probe::host_probe_reads_what_the_terminal_needs"
because = "the container has `tic` and cannot be made to lack one it has, and three of the four cases need a host that does"

[[claim]]
id = "probe-refuses-an-answer-it-cannot-read"
statement = "An answer missing any field the script prints — the system, the machine, `tic`, the terminfo or every prefix candidate — is refused saying which was missing, rather than read as though a line that never arrived had said no."
test = "iznik-client::host_probe::host_probe_refuses_an_answer_it_cannot_read"
because = "a truncated answer is one no host produces, so only a written one can produce it"

[[claim]]
id = "probe-is-one-round-trip"
statement = "Probing a host runs exactly one remote command through the seam the transport implements, because latency to a distant host is the cost the whole design of this is about."
test = "iznik-client::host_probe::host_probe_is_one_round_trip"
because = "what is proven is a count of what the probe asked for, and counting is done here rather than by watching a network"

[[claim]]
id = "probe-reads-a-fresh-host"
statement = "From the engine container, a host as its image leaves it probes as Linux with no server installed, `tic` available, the terminal's terminfo absent, and the data home as its prefix."
scenario = "fresh-host"

[[claim]]
id = "probe-falls-back-when-a-home-is-unwritable"
statement = "A host whose home its own user cannot write is still probed, and says the runtime directory is where iznik would put things instead."
scenario = "unwritable-home"

[[claim]]
id = "probe-reads-the-server-at-the-prefix-it-chose"
statement = "The server reported is the one at the prefix that was chosen, and not one at a candidate the host will not let this user write — because what a bootstrap runs is `<chosen>/bin/iznik-server`, and a version read from somewhere else would put an upgrade decision on a binary nothing is going to execute."
test = "iznik-client::host_probe::host_probe_reads_the_server_at_the_prefix_it_chose"
because = "which candidate a version came from is a property of the answer and of the function that reads it"

[[claim]]
id = "probe-reads-a-prefix-with-a-space-in-it"
statement = "A candidate whose path contains a space is read whole, path and version both, rather than cut at the space into an unwritable stump that would have the host refused for a reason that is not the reason. What is then run under that prefix is quoted by the channel, which is `channel-quotes-the-server-it-asks-for`."
test = "iznik-client::host_probe::host_probe_reads_a_prefix_with_a_space_in_it"
because = "it is a property of the line the script prints and the function that reads it"

[[claim]]
id = "probe-reads-the-terminfo-at-the-prefix-it-chose"
statement = "The terminfo reported is the one under the prefix that was chosen, and not one under a candidate this user cannot write — because what a pane on this host will be told about is `<chosen>/terminfo`, and an entry elsewhere would have the server pointed at a directory that is not there."
test = "iznik-client::host_probe::host_probe_reads_the_terminfo_at_the_prefix_it_chose"
because = "which candidate an answer came from is a property of the answer and of the function that reads it"
