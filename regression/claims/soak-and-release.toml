# Hours of the whole stack, and the list a release runs through.
#
# What the soak is for cannot be proven by anything that runs in a test: a leak
# of a few kilobytes per reconnection needs hours to show. So the proofs here
# are of the instrument rather than of the result — the schedule runs, the
# growth check catches a series that climbs, the byte-loss check catches a
# stream that jumped, and a flooded pane survives a drop in a container — and
# the result itself is a six-hour run by a person, which the checklist asks for
# and `docs/notes/soak.md` records.
#
# The arithmetic proofs are `test` proofs because a series of numbers is the
# same series anywhere it is read. The pane proof is a scenario because what it
# asks about is a real link between two containers being cut.

[[claim]]
id = "soak-runs-the-whole-stack"
statement = "A soak of one minute stands two hosts up, holds a client open against a pane on one of them for the whole run, floods that pane, cuts the link underneath it — verifying that what it stopped was the daemon and that the daemon really stopped — makes and unmakes sessions on the other host, and weighs the held client and both daemons. What the held client heard is counted and held against what its pane was made to say, because a stream with no gap in it and a stream that was never there look the same to a check that only looks for gaps."
test = "xtask::regression_soak::regression_soak_runs_the_whole_stack_for_a_minute"
because = "it stands the fixture up itself, which is what the soak is; a scenario would be a second fixture inside the first"

[[claim]]
id = "soak-notices-a-series-that-climbs"
statement = "A series climbing four times the ceiling is caught, one that levels off is not however high it started, and one climbing half the ceiling passes — so the ceiling is a ceiling and not a ban on growth."
test = "xtask::regression_soak::regression_soak_notices_a_series_that_climbs"
because = "a growth is arithmetic over a series of numbers, and the numbers are the same wherever they are read"

[[claim]]
id = "soak-measures-nothing-before-the-warmup"
statement = "Nothing before the warmup is measured, and a series with one sample after it says nothing rather than guessing a rate from a single point: a process that has just started is filling the ring every pane keeps and is not leaking."
test = "xtask::regression_soak::regression_soak_measures_nothing_before_the_warmup"
because = "what is proven is which samples the arithmetic looks at"

[[claim]]
id = "soak-counts-what-the-held-client-was-sent"
statement = "What the held client was sent is counted rather than only inspected for gaps. A screen is counted, because that is what losing bytes looks like from a client: the host could not carry it on from where it was and sent the truth as it now stands instead. A detached pane ends the run, because a client that stopped listening leaves a stream with no gap in it, which is exactly what a check that only looks for gaps calls whole. The gap check remains and catches a client whose own accounting broke — the sequence it prints is its own cursor, so two deliveries in a row cannot disagree unless it is — and the reckoning carries from one window of lines to the next."
test = "xtask::regression_soak::regression_soak_counts_what_the_held_client_was_sent"
because = "it is a property of the text the held client writes, and reading it needs no client to have written it"

[[claim]]
id = "soak-counts-what-a-flood-says"
statement = "How many bytes `seq 1 <lines>` says through a pseudoterminal is arithmetic — the digits of every number and the two characters a terminal ends a line with — so what the held client heard can be held against what its pane was made to say rather than against nothing."
test = "xtask::regression_soak::regression_soak_counts_what_a_flood_says"
because = "it is arithmetic over the numbers, and the same anywhere it is done"

[[claim]]
id = "soak-judges-a-run-by-what-it-did"
statement = "What decides whether a soak passed is asked of a report directly, so it is proven without waiting six hours for one. A run that did everything asked of it passes; a held client gone before the end, one that heard less than its pane was made to say, a screen count that is not exactly one — none means the attachment was never seen, more means bytes it was not carried on from — most of the rounds not finishing, and a run that never churned a session are each refused. What the held client is held to is the floods that were poured and not the rounds that finished, so a round that floods and then fails buys no slack."
test = "xtask::regression_soak::regression_soak_judges_a_run_by_what_it_did"
because = "a report is a value, and judging one needs no containers to have made it"

[[claim]]
id = "soak-judges-a-run-by-what-it-weighed"
statement = "A side over the ceiling is refused, one under it is not, a side never weighed at all is refused, and so is a side whose samples measure nothing after the warmup — which is the same silence wearing a series, and which would otherwise skip the ceiling entirely and pass. This is what holds the ceiling comparison itself: inverting it leaves every other case in the file green."
test = "xtask::regression_soak::regression_soak_judges_a_run_by_what_it_weighed"
because = "a report is a value, and judging one needs no containers to have made it"

[[claim]]
id = "soak-weighs-with-one-census"
statement = "The scenario that proves the census works in a container runs the soak's own `WEIGH`, word for word with the name filled in, and a case holds the two texts together after the scenario is parsed. A census transcribed into a scenario is a replica: the two had already drifted in the clause the claim rests on, so dropping the guard that leaves the relay out would have left every proof green while every sample the soak took alternated between a daemon and a relay."
test = "xtask::regression_soak::regression_soak_weighs_with_one_census"
because = "both texts are in this repository and comparing them needs nothing else"

[[claim]]
id = "soak-refuses-a-warmup-that-swallows-the-run"
statement = "A soak no longer than the warmup it would use is refused rather than run: nothing after the warmup means nothing measured, and nothing measured would pass. `cargo xtask soak --duration 10` with the ten-minute default warmup is that soak, and a number of minutes no duration can hold is refused rather than panicked on by a path whose whole job is to answer a bad command line."
test = "xtask::regression_soak::regression_soak_refuses_a_warmup_that_swallows_the_run"
because = "it is what a command line means, which is the same wherever it is read"

[[claim]]
id = "soak-reads-a-peak-as-a-peak"
statement = "A level series with one sample twice the size in its later half grew by nothing, and a half of two samples is read as what lies between them rather than as the larger of them — because a flood in flight puts a peak on whichever sample catches it, and taking the upper middle would report megabytes an hour for a process that never grew."
test = "xtask::regression_soak::regression_soak_reads_a_peak_as_a_peak"
because = "it is arithmetic over a series of numbers"

[[claim]]
id = "soak-compacts-what-the-held-client-prints"
statement = "What the held client prints is reduced to four fields a delivery as it is written — its kind, where it starts, and how many characters of base 64 and how many of padding carry it — because a soak of hours moves tens of megabytes through that pane and a command's output is captured up to one. The filter is run against exactly what `iznik tail` writes and its output handed to the check, so the two are proven to agree rather than assumed to: a gap put into the printed lines is still a gap after the filter has seen them, a line whose kind the filter does not know still comes out with four fields rather than shifting every number one place left, and the line the client prints as it stops is still an ending."
test = "xtask::regression_soak::regression_soak_compacts_what_the_held_client_prints"
because = "`awk` is on this machine and the lines are the ones the command writes; a container would put the same two programs somewhere further away"

[[claim]]
id = "soak-holds-a-flooded-pane-across-a-drop"
statement = "Twenty thousand lines through a pane held by a client that returns credit for what it takes, the network cut underneath it and brought back, and the stream resumed from where it stopped: the screen, what arrived before the cut and what arrived after it reassemble into one, so the drop lost no byte. What the soak does for hours, once."
scenario = "short-soak"

[[claim]]
id = "soak-weighs-what-is-running"
statement = "With a relay held open beside the daemon, the census the soak weighs with counts two processes answering to `iznik-server` and exactly one daemon among them, and reads a resident size that was really taken. The relay is left out by name because a host runs one of each and a weighing that took the first one it found would be of the daemon at one sample and of a relay at the next, reporting a leak and a recovery that neither happened; the reading is out of `/proc` because the engine image carries no `ps` at all."
scenario = "short-soak"

[[claim]]
id = "soak-committed-a-report-of-ten-minutes"
statement = "`docs/notes/soak.md` is a report of a real run of at least ten minutes, naming the machine, the duration, the warmup, the rounds, the churn, what the held client heard, and all three memory series."
test = "xtask::regression_soak::regression_soak_committed_a_report_of_ten_minutes"
because = "the note is a file in this repository, and what it says is read from it"

[[claim]]
id = "soak-checklist-names-a-release-in-order"
statement = "The release checklist names the soak report, the baseline, `cargo xtask check`, `xtask claims coverage`, the distribution artifacts and the golden header, in that order — the soak first because it is the only item that takes a working day and the only one that fails for reasons the others cannot see."
test = "xtask::regression_soak::regression_soak_checklist_names_a_release_in_order"
because = "the checklist is a file in this repository, and the order is where each name appears in it"
