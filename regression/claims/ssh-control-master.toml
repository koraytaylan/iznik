# The transport is the one place iznik touches somebody's SSH configuration,
# and the one place it must not. What is claimed here is that it adds only the
# four options it owns, that a master is made once and reused, and that the
# four ways a connection fails are four messages rather than one.
#
# The argument vector and the classification are `test` proofs: a vector is a
# value, and `ssh`'s own words for a refusal, an unresolvable name, a denied
# key and a changed host key are captured under `tests/fixtures/ssh/`. Every
# claim about what actually happens over a network is a scenario, run from the
# engine container against the fixture's host.

[[claim]]
id = "transport-adds-only-what-it-owns"
statement = "The command line iznik builds carries the control master, the control path, the persistence, the keepalives and the connect timeout, then the alias and the command — and none of `User`, `Port`, `IdentityFile`, `ProxyJump`, `HostName` or the short flags that mean the same, because those are what a person's own configuration is for."
test = "iznik-client::ssh_control_master::ssh_passes_what_it_owns_and_nothing_a_person_configured"
because = "what is being proven is the absence of arguments, which is a property of a value and not of a network"

[[claim]]
id = "transport-windows-skips-control-master"
statement = "A Windows command line omits ControlMaster, ControlPath and ControlPersist, because Win32-OpenSSH cannot multiplex, and still sends the keepalives, the connect timeout, the alias and the command."
test = "iznik-client::ssh_control_master::windows_ssh_skips_control_master"
because = "the command line is a value; Win32-OpenSSH's missing multiplexing is a property of that program, not of a network"

[[claim]]
id = "transport-reads-the-one-alias-it-owns"
statement = "`unix:<path>` names a daemon socket on this machine and is reached with no SSH at all; every other alias is handed to `ssh` untouched, and a control socket is named by a digest so it fits the hundred and four bytes a unix path allows and never collides with another alias's."
test = "iznik-client::ssh_control_master::ssh_reads_the_one_alias_form_it_owns"
because = "reading a prefix and naming a path are the same on any machine"

[[claim]]
id = "transport-names-a-control-socket-that-fits"
statement = "Two aliases are given two control paths, each under the eighty-six bytes a unix socket path leaves for `ssh` on macOS after it reserves its own temporary bind, even when the alias is a written-out jump chain or the runtime directory is as deep as that limit allows, and one alias is given the same path every time or no master is ever reused."
test = "iznik-client::ssh_control_master::ssh_names_a_control_socket_that_fits"
because = "the limit is the platform's and the digest is arithmetic; a container would compute the same paths"

[[claim]]
id = "transport-classifies-what-ssh-said"
statement = "A refusal, an unresolvable name, a timed-out connection, a denied key, a changed host key and a command that failed are six captured outputs and six named failures, each carrying the host — and the changed host key says, in words, not to connect until you know why."
test = "iznik-client::ssh_control_master::ssh_says_which_failure_it_was"
because = "the outputs are `ssh`'s own, captured; arranging five hosts to produce them again would prove nothing more"

[[claim]]
id = "transport-tells-its-own-failure-from-the-commands"
statement = "An `ssh` that exited with its own status, or with none at all, is a link that failed however unfamiliar its words; any other status is the remote command's, with what it exited with and what it said."
test = "iznik-client::ssh_control_master::ssh_tells_a_link_failure_from_a_command_failure"
because = "the rule is about a status and a string, and holds wherever they came from"

[[claim]]
id = "transport-connects-over-the-user-configuration"
statement = "From the engine container, which has no agent and no keys but the one the fixture wrote, a command runs on the host through the alias the user's own configuration names."
scenario = "connects"

[[claim]]
id = "transport-keeps-a-master-and-lets-it-go"
statement = "The first command leaves a master `ssh -O check` finds, the second runs over it in less than half the first's time, and closing it leaves none."
scenario = "reuses-the-master"

[[claim]]
id = "transport-says-nothing-answered"
statement = "An alias whose address nothing answers on fails as unreachable within the two seconds it was given, rather than waiting out a default."
scenario = "unreachable"

[[claim]]
id = "transport-says-the-credentials-were-refused"
statement = "An alias offering a key the host has never been told about fails as authentication refused — the host answered, which is what makes it a different thing from being unreachable."
scenario = "authentication-refused"

[[claim]]
id = "transport-says-a-host-key-changed"
statement = "A `known_hosts` entry rewritten to a key the host will never present fails as a changed host key, which is its own message and not a connection error."
scenario = "host-key-changed"
