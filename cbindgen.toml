# What `cargo xtask header` generates `include/iznik.h` from.
#
# The header is the contract a native application is built against, and it is
# generated rather than written so that it cannot drift from the crate: a
# change to a signature is a change to the golden copy in the same commit,
# which `xtask/tests/header_golden.rs` is what enforces.

language = "C"
header = "/* Generated by `cargo xtask header` from crates/iznik-ffi. Do not edit. */"
include_guard = "IZNIK_H"
# Nothing about the generator's version: it would make the golden copy change
# when nothing about the contract did.
autogen_warning = ""
documentation = true
documentation_style = "doxy"
# Typedefs, so the C spelling is `iznik_client *` rather than `struct ...`.
style = "type"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export]
item_types = ["enums", "structs", "typedefs", "opaque", "functions", "constants"]

# The functions carry `iznik_` in their own names; the types are named for
# what they are, so each is given the name the architecture writes.
[export.rename]
Client = "iznik_client"
Configuration = "iznik_configuration"
Error = "iznik_error"
Layer = "iznik_layer"
Event = "iznik_event"
EventKind = "iznik_event_kind"
EventCallback = "iznik_event_callback"
PaneCallbacks = "iznik_pane_callbacks"
# And the codes, which would otherwise be four of the commonest words there
# are, defined in a header somebody includes beside their own.
OK = "IZNIK_OK"
INVALID_ARGUMENT = "IZNIK_INVALID_ARGUMENT"
UNKNOWN_HOST = "IZNIK_UNKNOWN_HOST"
REFUSED = "IZNIK_REFUSED"

[parse]
parse_deps = false

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
